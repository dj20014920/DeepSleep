name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        make setup

    - name: Run full pipeline
      run: |
        make all

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Notify Slack
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: python3 scripts/notify_slack.py

    - name: Notify Discord
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python3 scripts/notify_discord.py

    - name: Upload logs
      uses: actions/upload-artifact@v3
      with:
        name: logs
        path: logs/

  build-test-coverage:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install Fastlane
        run: gem install fastlane
      - name: Xcode Select
        run: sudo xcode-select -s "/Applications/Xcode_15.0.1.app"
      - name: Run tests with coverage
        run: |
          xcodebuild test -scheme DeepSleep \
            -destination "platform=iOS Simulator,name=iPhone 15 Pro" \
            -enableCodeCoverage YES \
            -derivedDataPath DerivedData
      - name: Generate coverage report (HTML)
        run: |
          set -e
          BUNDLE=$(find DerivedData/Logs/Test -name '*.xcresult' | head -n1)
          if [[ -z "$BUNDLE" ]]; then echo "No xcresult found"; exit 1; fi
          xcrun xccov view --report --json "$BUNDLE" > coverage.json
          xcrun xccov view --report "$BUNDLE" > coverage.txt
          xcrun xccov view --html "$BUNDLE" > coverage.html || true
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage.txt
            coverage.html
      # (선택) gh-pages 배포 스텝 추가 가능 