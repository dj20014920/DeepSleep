name: Build Background Asset Packs
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/make_ba_packs_no_tool.zsh'
      - 'manifests/**'
      - '.github/workflows/ba-packs.yml'

jobs:
  build-asset-packs:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python venv + HF CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "huggingface_hub[cli]"
          .venv/bin/hf --help

      - name: Build BA .aar with zip fallback (no Apple tool)
        shell: bash
        env:
          PATH: ${{ github.workspace }}/.venv/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          /bin/chmod +x scripts/make_ba_packs_no_tool.zsh
          /bin/zsh scripts/make_ba_packs_no_tool.zsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ba-packs
          path: |
            out/*.aar
            out/sha256sum.txt
