name: Build Background Asset Packs
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/make_ba_packs.zsh'
      - 'manifests/**'
      - '.github/workflows/ba-packs.yml'
jobs:
  build-asset-packs:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --version || true
      - name: Build BA .aar packs
        shell: bash
        run: |
          chmod +x scripts/make_ba_packs.zsh
          scripts/make_ba_packs.zsh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ba-packs
          path: |
            out/*.aar
            out/sha256sum.txt
